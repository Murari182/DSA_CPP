<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .mat-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 14px; fill: #2563eb; text-anchor: middle; dominant-baseline: central; }
      .mat-val { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 14px; fill: #334155; text-anchor: middle; dominant-baseline: central; }
      .mat-val-active { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #15803d; text-anchor: middle; dominant-baseline: central; }
      .mat-val-hl { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
      .code-font { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Graph Representation: Adjacency Matrix</text>
  <text x="36" y="62" class="subtitle">2D Array V × V layout, edge lookups, neighbour scanning, and memory overhead</text>

  <!-- LEFT PANEL: Running 5-Vertex Graph -->
  <g transform="translate(36, 85)">
    <rect width="360" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">Running Example: Undirected Graph (V = 5, E = 5)</text>
    <text x="20" y="48" class="desc-text">Edges: (0,1), (1,2), (2,3), (1,3), (2,4)</text>

    <!-- Graph Drawing -->
    <g transform="translate(20, 40)">
      <!-- Edges -->
      <line x1="60" y1="110" x2="160" y2="70" stroke="#94a3b8" stroke-width="3"/>
      <line x1="160" y1="70" x2="260" y2="120" stroke="#94a3b8" stroke-width="3"/>
      <line x1="160" y1="70" x2="160" y2="210" stroke="#f97316" stroke-width="4"/>
      <line x1="260" y1="120" x2="160" y2="210" stroke="#94a3b8" stroke-width="3"/>
      <line x1="260" y1="120" x2="280" y2="230" stroke="#94a3b8" stroke-width="3"/>

      <!-- Nodes -->
      <circle cx="60" cy="110" r="20" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
      <text x="60" y="110" class="node-text">0</text>

      <circle cx="160" cy="70" r="20" fill="#ea580c" stroke="#c2410c" stroke-width="2.5"/>
      <text x="160" y="70" class="node-text">1</text>

      <circle cx="260" cy="120" r="20" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
      <text x="260" y="120" class="node-text">2</text>

      <circle cx="160" cy="210" r="20" fill="#ea580c" stroke="#c2410c" stroke-width="2.5"/>
      <text x="160" y="210" class="node-text">3</text>

      <circle cx="280" cy="230" r="20" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
      <text x="280" y="230" class="node-text">4</text>

      <rect x="25" y="275" width="270" height="58" rx="6" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
      <text x="35" y="295" class="callout" fill="#9a3412">Highlighted edge (1, 3):</text>
      <text x="35" y="315" class="code-font" fill="#7c2d12">matrix[1][3] == 1 and matrix[3][1] == 1</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Adjacency Matrix Grid & Complexity -->
  <g transform="translate(416, 85)">
    <rect width="508" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">Adjacency Matrix Grid: bool adj[5][5]</text>

    <!-- Matrix Grid Container -->
    <g transform="translate(45, 55)">
      <!-- Column Headers -->
      <text x="65" y="20" class="mat-header">[0]</text>
      <text x="110" y="20" class="mat-header">[1]</text>
      <text x="155" y="20" class="mat-header">[2]</text>
      <text x="200" y="20" class="mat-header">[3]</text>
      <text x="245" y="20" class="mat-header">[4]</text>

      <!-- Row Headers -->
      <text x="20" y="55" class="mat-header">[0]</text>
      <text x="20" y="95" class="mat-header">[1]</text>
      <text x="20" y="135" class="mat-header">[2]</text>
      <text x="20" y="175" class="mat-header">[3]</text>
      <text x="20" y="215" class="mat-header">[4]</text>

      <!-- Row 2 highlight (scanning all neighbours of vertex 2) -->
      <rect x="45" y="115" width="225" height="40" fill="#dcfce7" rx="4" stroke="#86efac" stroke-width="1.5"/>

      <!-- Matrix Cells (Row 0) -->
      <rect x="45" y="35" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="67" y="55" class="mat-val">0</text>
      <rect x="90" y="35" width="45" height="40" fill="#e0e7ff" stroke="#c7d2fe"/>
      <text x="112" y="55" class="mat-val-active">1</text>
      <rect x="135" y="35" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="157" y="55" class="mat-val">0</text>
      <rect x="180" y="35" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="202" y="55" class="mat-val">0</text>
      <rect x="225" y="35" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="247" y="55" class="mat-val">0</text>

      <!-- Matrix Cells (Row 1) -->
      <rect x="45" y="75" width="45" height="40" fill="#e0e7ff" stroke="#c7d2fe"/>
      <text x="67" y="95" class="mat-val-active">1</text>
      <rect x="90" y="75" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="112" y="95" class="mat-val">0</text>
      <rect x="135" y="75" width="45" height="40" fill="#e0e7ff" stroke="#c7d2fe"/>
      <text x="157" y="95" class="mat-val-active">1</text>
      <!-- Row 1, Col 3 highlighted -->
      <rect x="180" y="75" width="45" height="40" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
      <text x="202" y="95" class="mat-val-hl">1</text>
      <rect x="225" y="75" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="247" y="95" class="mat-val">0</text>

      <!-- Matrix Cells (Row 2 - highlighted) -->
      <rect x="45" y="115" width="45" height="40" fill="none" stroke="#86efac"/>
      <text x="67" y="135" class="mat-val">0</text>
      <rect x="90" y="115" width="45" height="40" fill="#bbf7d0" stroke="#86efac"/>
      <text x="112" y="135" class="mat-val-active">1</text>
      <rect x="135" y="115" width="45" height="40" fill="none" stroke="#86efac"/>
      <text x="157" y="135" class="mat-val">0</text>
      <rect x="180" y="115" width="45" height="40" fill="#bbf7d0" stroke="#86efac"/>
      <text x="202" y="135" class="mat-val-active">1</text>
      <rect x="225" y="115" width="45" height="40" fill="#bbf7d0" stroke="#86efac"/>
      <text x="247" y="135" class="mat-val-active">1</text>

      <!-- Matrix Cells (Row 3) -->
      <rect x="45" y="155" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="67" y="175" class="mat-val">0</text>
      <!-- Row 3, Col 1 highlighted -->
      <rect x="90" y="155" width="45" height="40" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
      <text x="112" y="175" class="mat-val-hl">1</text>
      <rect x="135" y="155" width="45" height="40" fill="#e0e7ff" stroke="#c7d2fe"/>
      <text x="157" y="175" class="mat-val-active">1</text>
      <rect x="180" y="155" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="202" y="175" class="mat-val">0</text>
      <rect x="225" y="155" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="247" y="175" class="mat-val">0</text>

      <!-- Matrix Cells (Row 4) -->
      <rect x="45" y="195" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="67" y="215" class="mat-val">0</text>
      <rect x="90" y="195" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="112" y="215" class="mat-val">0</text>
      <rect x="135" y="195" width="45" height="40" fill="#e0e7ff" stroke="#c7d2fe"/>
      <text x="157" y="215" class="mat-val-active">1</text>
      <rect x="180" y="195" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="202" y="215" class="mat-val">0</text>
      <rect x="225" y="195" width="45" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="247" y="215" class="mat-val">0</text>

      <!-- Symmetric Note -->
      <path d="M 45 35 L 270 235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="280" y="140" class="desc-text" font-size="11" fill="#64748b">Symmetric diagonal (undirected)</text>
    </g>

    <!-- Operational Tradeoffs Box -->
    <g transform="translate(24, 305)">
      <rect width="460" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="16" y="22" class="callout" fill="#0f172a">Complexity Profile:</text>
      <text x="16" y="42" class="desc-text">• <tspan font-weight="600" fill="#15803d">Edge Lookup adj[u][v]:</tspan> O(1) instantaneous array indexing.</text>
      <text x="16" y="58" class="desc-text">• <tspan font-weight="600" fill="#c2410c">Iterate Neighbours of v:</tspan> O(V) scan across row (wastes time checking 0s).</text>
      <text x="16" y="74" class="desc-text">• <tspan font-weight="600" fill="#b91c1c">Space Complexity:</tspan> O(V²) fixed storage — impractical for large sparse graphs.</text>
    </g>
  </g>
</svg>
