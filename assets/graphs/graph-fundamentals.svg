<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 16px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #b45309; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #1e3a8a; text-anchor: middle; dominant-baseline: central; }
    </style>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" class="title">Graph Data Structure Fundamentals</text>
  <text x="36" y="62" class="subtitle">Taxonomy of graph types, structural properties, and edge classifications</text>

  <!-- Panel 1: Undirected Graph -->
  <g transform="translate(36, 85)">
    <rect width="270" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" class="section-title">1. Undirected Graph</text>
    <text x="16" y="42" class="desc-text">Edges have no direction: (u, v) == (v, u)</text>
    <text x="16" y="58" class="desc-text">Degree(v) = number of incident edges</text>

    <!-- Graph Drawing -->
    <line x1="60" y1="125" x2="135" y2="85" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="135" y1="85" x2="210" y2="125" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="60" y1="125" x2="135" y2="165" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="135" y1="165" x2="210" y2="125" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="135" y1="85" x2="135" y2="165" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Nodes -->
    <circle cx="60" cy="125" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="125" class="node-text">A</text>

    <circle cx="135" cy="85" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="85" class="node-text">B</text>

    <circle cx="210" cy="125" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="210" y="125" class="node-text">C</text>

    <circle cx="135" cy="165" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="165" class="node-text">D</text>

    <rect x="16" y="172" width="75" height="16" rx="4" fill="#dbeafe"/>
    <text x="53" y="180" class="badge-text">deg(B) = 3</text>
  </g>

  <!-- Panel 2: Directed Graph (Digraph) -->
  <g transform="translate(345, 85)">
    <rect width="270" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" class="section-title">2. Directed Graph (Digraph)</text>
    <text x="16" y="42" class="desc-text">Edges have orientation: u → v ≠ v → u</text>
    <text x="16" y="58" class="desc-text">Separates in-degree and out-degree</text>

    <!-- Edges with Arrows -->
    <line x1="60" y1="125" x2="135" y2="85" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="135" y1="85" x2="210" y2="125" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="60" y1="125" x2="135" y2="165" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="135" y1="165" x2="210" y2="125" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <circle cx="60" cy="125" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="125" class="node-text">0</text>

    <circle cx="135" cy="85" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="85" class="node-text">1</text>

    <circle cx="210" cy="125" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="210" y="125" class="node-text">2</text>

    <circle cx="135" cy="165" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="165" class="node-text">3</text>

    <rect x="16" y="172" width="135" height="16" rx="4" fill="#dbeafe"/>
    <text x="83" y="180" class="badge-text">in(2) = 2, out(2) = 0</text>
  </g>

  <!-- Panel 3: Weighted Graph -->
  <g transform="translate(654, 85)">
    <rect width="270" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" class="section-title">3. Weighted Graph</text>
    <text x="16" y="42" class="desc-text">Every edge carries a numerical weight/cost</text>
    <text x="16" y="58" class="desc-text">Used in shortest paths, network flows</text>

    <!-- Edges with weights -->
    <line x1="60" y1="125" x2="135" y2="85" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="135" y1="85" x2="210" y2="125" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="60" y1="125" x2="135" y2="165" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="135" y1="165" x2="210" y2="125" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Weight Badges -->
    <rect x="88" y="93" width="22" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="99" y="101" class="edge-label">4</text>

    <rect x="162" y="93" width="22" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="173" y="101" class="edge-label">8</text>

    <rect x="88" y="145" width="22" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="99" y="153" class="edge-label">2</text>

    <rect x="162" y="145" width="22" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="173" y="153" class="edge-label">6</text>

    <!-- Nodes -->
    <circle cx="60" cy="125" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="125" class="node-text">u</text>

    <circle cx="135" cy="85" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="85" class="node-text">v</text>

    <circle cx="210" cy="125" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="210" y="125" class="node-text">w</text>

    <circle cx="135" cy="165" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="165" class="node-text">z</text>

    <rect x="16" y="172" width="115" height="16" rx="4" fill="#fef3c7"/>
    <text x="73" y="180" class="badge-text" fill="#b45309">weight(u, z) = 2</text>
  </g>

  <!-- Panel 4: Cyclic vs Acyclic (DAG) -->
  <g transform="translate(36, 295)">
    <rect width="270" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" class="section-title">4. Cyclic vs Acyclic (DAG)</text>
    <text x="16" y="42" class="desc-text">Cycle: non-empty path starting/ending at same v</text>
    <text x="16" y="58" class="desc-text">DAG: Directed Acyclic Graph (no back cycles)</text>

    <!-- Directed Cycle -->
    <line x1="70" y1="100" x2="140" y2="100" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <line x1="140" y1="100" x2="105" y2="155" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <line x1="105" y1="155" x2="70" y2="100" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

    <circle cx="70" cy="100" r="14" fill="#dc2626"/>
    <text x="70" y="100" class="node-text">1</text>
    <circle cx="140" cy="100" r="14" fill="#dc2626"/>
    <text x="140" y="100" class="node-text">2</text>
    <circle cx="105" cy="155" r="14" fill="#dc2626"/>
    <text x="105" y="155" class="node-text">3</text>

    <!-- Linear DAG -->
    <line x1="180" y1="125" x2="235" y2="125" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="180" cy="125" r="14" fill="#16a34a"/>
    <text x="180" y="125" class="node-text">A</text>
    <circle cx="235" cy="125" r="14" fill="#16a34a"/>
    <text x="235" y="125" class="node-text">B</text>

    <rect x="16" y="172" width="130" height="16" rx="4" fill="#fee2e2"/>
    <text x="81" y="180" class="badge-text" fill="#b91c1c">Cycle: 1 → 2 → 3 → 1</text>
  </g>

  <!-- Panel 5: Connected vs Disconnected -->
  <g transform="translate(345, 295)">
    <rect width="270" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" class="section-title">5. Connected Components</text>
    <text x="16" y="42" class="desc-text">Connected: path exists between any two vertices</text>
    <text x="16" y="58" class="desc-text">Disconnected: partitioned into components</text>

    <!-- Component 1 -->
    <rect x="25" y="80" width="105" height="85" rx="6" fill="#e0e7ff" stroke="#818cf8" stroke-dasharray="3,3"/>
    <line x1="50" y1="120" x2="105" y2="120" stroke="#4f46e5" stroke-width="2.5"/>
    <circle cx="50" cy="120" r="14" fill="#4f46e5"/>
    <text x="50" y="120" class="node-text">0</text>
    <circle cx="105" cy="120" r="14" fill="#4f46e5"/>
    <text x="105" y="120" class="node-text">1</text>
    <text x="77" y="95" class="subtitle" font-size="10" text-anchor="middle">Comp 1</text>

    <!-- Component 2 -->
    <rect x="145" y="80" width="105" height="85" rx="6" fill="#dcfce7" stroke="#86efac" stroke-dasharray="3,3"/>
    <line x1="165" y1="135" x2="225" y2="135" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="165" y1="135" x2="195" y2="100" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="225" y1="135" x2="195" y2="100" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="165" cy="135" r="12" fill="#16a34a"/>
    <text x="165" y="135" class="node-text" font-size="13">2</text>
    <circle cx="225" cy="135" r="12" fill="#16a34a"/>
    <text x="225" y="135" class="node-text" font-size="13">3</text>
    <circle cx="195" cy="100" r="12" fill="#16a34a"/>
    <text x="195" y="100" class="node-text" font-size="13">4</text>
    <text x="195" y="90" class="subtitle" font-size="10" text-anchor="middle">Comp 2</text>

    <rect x="16" y="172" width="145" height="16" rx="4" fill="#fef3c7"/>
    <text x="88" y="180" class="badge-text" fill="#b45309">2 Disjoint Components</text>
  </g>

  <!-- Panel 6: Special Graph Structures -->
  <g transform="translate(654, 295)">
    <rect width="270" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="24" class="section-title">6. Self-Loops &amp; Multigraphs</text>
    <text x="16" y="42" class="desc-text">Simple graph: no self-loops, no parallel edges</text>
    <text x="16" y="58" class="desc-text">Multigraph: multiple edges between same pair</text>

    <!-- Self loop on A -->
    <path d="M 60 110 C 30 75, 90 75, 60 110" fill="none" stroke="#ea580c" stroke-width="2.5"/>
    <circle cx="60" cy="125" r="15" fill="#2563eb"/>
    <text x="60" y="125" class="node-text">A</text>

    <!-- Parallel edges between B and C -->
    <path d="M 140 120 C 170 95, 195 95, 225 120" fill="none" stroke="#ea580c" stroke-width="2.5"/>
    <path d="M 140 130 C 170 155, 195 155, 225 130" fill="none" stroke="#ea580c" stroke-width="2.5"/>
    <circle cx="140" cy="125" r="15" fill="#2563eb"/>
    <text x="140" y="125" class="node-text">B</text>
    <circle cx="225" cy="125" r="15" fill="#2563eb"/>
    <text x="225" y="125" class="node-text">C</text>

    <rect x="16" y="172" width="165" height="16" rx="4" fill="#ffedd5"/>
    <text x="98" y="180" class="badge-text" fill="#c2410c">Self-loop (A) | Parallel (B-C)</text>
  </g>
</svg>
