<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .mono-code { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #1e3a8a; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .step-lbl { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: 600; font-size: 11px; fill: #0f172a; }
      .stack-frame { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 13px; fill: #6b21a8; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="dfs-tree" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="back-edge" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="516" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Depth-First Search (DFS) Traversal &amp; Call Stack</text>
  <text x="36" y="62" class="subtitle">Recursive exploration, backtracking mechanism, call stack frames, and cycle back-edges</text>

  <!-- LEFT PANEL: DFS Exploration Tree & Edge Classification -->
  <g transform="translate(36, 85)">
    <rect width="400" height="425" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">DFS Spanning Tree (Source = 0)</text>

    <g transform="translate(30, 45)">
      <!-- Root 0 -->
      <circle cx="160" cy="30" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="160" y="30" class="node-text">0</text>

      <!-- 0 -> 1 -->
      <line x1="160" y1="48" x2="160" y2="92" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dfs-tree)"/>
      <circle cx="160" cy="110" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="160" y="110" class="node-text">1</text>

      <!-- 1 -> 2 -->
      <line x1="160" y1="128" x2="160" y2="172" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dfs-tree)"/>
      <circle cx="160" cy="190" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="160" y="190" class="node-text">2</text>

      <!-- 2 -> 3 and 2 -> 4 -->
      <line x1="145" y1="202" x2="95" y2="248" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dfs-tree)"/>
      <circle cx="85" cy="260" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="85" y="260" class="node-text">3</text>

      <line x1="175" y1="202" x2="225" y2="248" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dfs-tree)"/>
      <circle cx="235" cy="260" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="235" y="260" class="node-text">4</text>

      <!-- BACK-EDGE from 3 to 1 (Curved red arrow) -->
      <path d="M 70 250 C 15 200, 15 130, 142 110" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#back-edge)"/>
      <rect x="15" y="155" width="80" height="22" rx="3" fill="#fee2e2" stroke="#f87171"/>
      <text x="55" y="166" class="step-lbl" fill="#991b1b" text-anchor="middle" dominant-baseline="central">Back-Edge!</text>
    </g>

    <!-- Legend -->
    <g transform="translate(20, 345)">
      <rect width="360" height="65" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <line x1="16" y1="20" x2="46" y2="20" stroke="#2563eb" stroke-width="2.5"/>
      <text x="56" y="24" class="desc-text"><tspan font-weight="600" fill="#1e40af">Tree Edge:</tspan> Discovers a new unvisited vertex</text>
      <line x1="16" y1="42" x2="46" y2="42" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4"/>
      <text x="56" y="46" class="desc-text"><tspan font-weight="600" fill="#dc2626">Back Edge:</tspan> Points to an ancestor → proves a CYCLE exists!</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Call Stack Frames & Execution Trace -->
  <g transform="translate(456, 85)">
    <rect width="468" height="425" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">Recursion Call Stack Evolution</text>

    <!-- Visual Stack at Peak Depth (Visiting Vertex 3) -->
    <g transform="translate(24, 45)">
      <text x="0" y="16" class="desc-text" font-weight="600">Peak Call Stack State (visiting 3):</text>

      <!-- Stack Frame 3 -->
      <rect x="0" y="28" width="190" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <text x="95" y="45" class="stack-frame">dfs(node = 3)</text>
      <text x="200" y="45" class="desc-text" fill="#7c3aed">← Active execution</text>

      <!-- Stack Frame 2 -->
      <rect x="0" y="68" width="190" height="34" rx="4" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="95" y="85" class="stack-frame">dfs(node = 2)</text>
      <text x="200" y="85" class="desc-text">Waiting for child 3</text>

      <!-- Stack Frame 1 -->
      <rect x="0" y="108" width="190" height="34" rx="4" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="95" y="125" class="stack-frame">dfs(node = 1)</text>
      <text x="200" y="125" class="desc-text">Waiting for child 2</text>

      <!-- Stack Frame 0 -->
      <rect x="0" y="148" width="190" height="34" rx="4" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="95" y="165" class="stack-frame">dfs(node = 0)</text>
      <text x="200" y="165" class="desc-text">Base root call</text>

      <!-- Stack Bottom -->
      <line x1="0" y1="188" x2="190" y2="188" stroke="#475569" stroke-width="3"/>
      <text x="95" y="202" class="desc-text" text-anchor="middle" font-size="11" fill="#64748b">Stack Base</text>
    </g>

    <!-- Step-by-Step Backtracking Timeline -->
    <g transform="translate(24, 260)">
      <rect width="420" height="145" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="14" y="22" class="step-lbl">DFS Traversal Order &amp; Backtracking Steps:</text>
      <text x="14" y="44" class="desc-text">1. Enter <tspan class="mono-code">0</tspan> → visit <tspan class="mono-code">1</tspan> → visit <tspan class="mono-code">2</tspan> → visit <tspan class="mono-code">3</tspan>.</text>
      <text x="14" y="62" class="desc-text">2. At <tspan class="mono-code">3</tspan>: neighbour <tspan class="mono-code">1</tspan> is already visited &amp; in-stack (Back-edge found!).</text>
      <text x="14" y="80" class="desc-text">3. Backtrack from <tspan class="mono-code">3</tspan> to <tspan class="mono-code">2</tspan>; visit remaining neighbour <tspan class="mono-code">4</tspan>.</text>
      <text x="14" y="98" class="desc-text">4. Backtrack from <tspan class="mono-code">4</tspan> to <tspan class="mono-code">2</tspan>, then <tspan class="mono-code">1</tspan>, then <tspan class="mono-code">0</tspan>. Traversal complete.</text>

      <rect x="14" y="112" width="390" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="195" y="124" class="mono-code" fill="#15803d" text-anchor="middle" dominant-baseline="central">DFS Sequence: 0 → 1 → 2 → 3 → 4</text>
    </g>
  </g>
</svg>
