<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .head-idx { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 14px; fill: #1e3a8a; text-anchor: middle; dominant-baseline: central; }
      .cell-val { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 14px; fill: #166534; text-anchor: middle; dominant-baseline: central; }
      .null-val { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #94a3b8; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; }
    </style>
    <marker id="ptr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="ptr-list" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Graph Representation: Adjacency List Structure</text>
  <text x="36" y="62" class="subtitle">Array of dynamic collections storing adjacent vertices — O(V + E) compact memory</text>

  <!-- LEFT PANEL: The Undirected Graph -->
  <g transform="translate(36, 85)">
    <rect width="320" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">Undirected Graph G = (V, E)</text>
    <text x="20" y="48" class="desc-text">|V| = 5 vertices, |E| = 5 edges</text>

    <!-- Graph Drawing -->
    <g transform="translate(10, 50)">
      <line x1="50" y1="100" x2="140" y2="60" stroke="#3b82f6" stroke-width="3"/>
      <line x1="140" y1="60" x2="230" y2="100" stroke="#3b82f6" stroke-width="3"/>
      <line x1="140" y1="60" x2="140" y2="190" stroke="#3b82f6" stroke-width="3"/>
      <line x1="230" y1="100" x2="140" y2="190" stroke="#3b82f6" stroke-width="3"/>
      <line x1="230" y1="100" x2="250" y2="200" stroke="#3b82f6" stroke-width="3"/>

      <!-- Nodes -->
      <circle cx="50" cy="100" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="50" y="100" class="node-text">0</text>

      <circle cx="140" cy="60" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="140" y="60" class="node-text">1</text>

      <circle cx="230" cy="100" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="230" y="100" class="node-text">2</text>

      <circle cx="140" cy="190" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="140" y="190" class="node-text">3</text>

      <circle cx="250" cy="200" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="250" y="200" class="node-text">4</text>

      <rect x="15" y="240" width="270" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="25" y="262" class="callout" fill="#0f172a">Edge count in Adjacency List:</text>
      <text x="25" y="282" class="desc-text">• Undirected: each edge stored 2× = 2|E| = 10</text>
      <text x="25" y="300" class="desc-text">• Directed: each edge stored 1× = |E| = 5</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Adjacency List Layout -->
  <g transform="translate(376, 85)">
    <rect width="548" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">Array of Lists: arr[0..4]</text>

    <g transform="translate(30, 45)">
      <!-- Row 0: Vertex 0 -->
      <rect x="0" y="15" width="75" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="37" y="33" class="head-idx">arr[0]</text>
      <line x1="75" y1="33" x2="115" y2="33" stroke="#3b82f6" stroke-width="2" marker-end="url(#ptr-arr)"/>
      <rect x="120" y="15" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="142" y="33" class="cell-val">1</text>
      <line x1="165" y1="33" x2="195" y2="33" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <text x="215" y="33" class="null-val">nullptr</text>

      <!-- Row 1: Vertex 1 -->
      <rect x="0" y="65" width="75" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="37" y="83" class="head-idx">arr[1]</text>
      <line x1="75" y1="83" x2="115" y2="83" stroke="#3b82f6" stroke-width="2" marker-end="url(#ptr-arr)"/>
      <rect x="120" y="65" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="142" y="83" class="cell-val">0</text>
      <line x1="165" y1="83" x2="195" y2="83" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <rect x="200" y="65" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="222" y="83" class="cell-val">2</text>
      <line x1="245" y1="83" x2="275" y2="83" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <rect x="280" y="65" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="302" y="83" class="cell-val">3</text>
      <line x1="325" y1="83" x2="355" y2="83" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <text x="375" y="83" class="null-val">nullptr</text>

      <!-- Row 2: Vertex 2 -->
      <rect x="0" y="115" width="75" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="37" y="133" class="head-idx">arr[2]</text>
      <line x1="75" y1="133" x2="115" y2="133" stroke="#3b82f6" stroke-width="2" marker-end="url(#ptr-arr)"/>
      <rect x="120" y="115" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="142" y="133" class="cell-val">1</text>
      <line x1="165" y1="133" x2="195" y2="133" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <rect x="200" y="115" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="222" y="133" class="cell-val">3</text>
      <line x1="245" y1="133" x2="275" y2="133" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <rect x="280" y="115" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="302" y="133" class="cell-val">4</text>
      <line x1="325" y1="133" x2="355" y2="133" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <text x="375" y="133" class="null-val">nullptr</text>

      <!-- Row 3: Vertex 3 -->
      <rect x="0" y="165" width="75" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="37" y="183" class="head-idx">arr[3]</text>
      <line x1="75" y1="183" x2="115" y2="183" stroke="#3b82f6" stroke-width="2" marker-end="url(#ptr-arr)"/>
      <rect x="120" y="165" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="142" y="183" class="cell-val">2</text>
      <line x1="165" y1="183" x2="195" y2="183" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <rect x="200" y="165" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="222" y="183" class="cell-val">1</text>
      <line x1="245" y1="183" x2="275" y2="183" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <text x="295" y="183" class="null-val">nullptr</text>

      <!-- Row 4: Vertex 4 -->
      <rect x="0" y="215" width="75" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="37" y="233" class="head-idx">arr[4]</text>
      <line x1="75" y1="233" x2="115" y2="233" stroke="#3b82f6" stroke-width="2" marker-end="url(#ptr-arr)"/>
      <rect x="120" y="215" width="45" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="142" y="233" class="cell-val">2</text>
      <line x1="165" y1="233" x2="195" y2="233" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-list)"/>
      <text x="215" y="233" class="null-val">nullptr</text>
    </g>

    <!-- Key Insights Box -->
    <g transform="translate(24, 305)">
      <rect width="500" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="16" y="22" class="callout" fill="#0f172a">Why Adjacency List dominates sparse graphs:</text>
      <text x="16" y="42" class="desc-text">• <tspan font-weight="600" fill="#15803d">Neighbour Iteration:</tspan> Exactly O(deg(v)) — visits ONLY real neighbours, no 0 checks.</text>
      <text x="16" y="58" class="desc-text">• <tspan font-weight="600" fill="#1e40af">Space Complexity:</tspan> O(V + E) proportional to actual network size.</text>
      <text x="16" y="74" class="desc-text">• <tspan font-weight="600" fill="#b45309">Edge Lookup:</tspan> O(deg(v)) traversal along list instead of O(1) direct indexing.</text>
    </g>
  </g>
</svg>
