<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .mono-code { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #1e3a8a; }
      .q-cell { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 14px; fill: #1e3a8a; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .level-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 12px; fill: #475569; }
      .step-lbl { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: 600; font-size: 11px; fill: #0f172a; }
    </style>
    <marker id="tree-edge" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="516" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Breadth-First Search (BFS) Traversal Progression</text>
  <text x="36" y="62" class="subtitle">Queue FIFO discipline, level-by-level frontier expansion, and unweighted shortest path tree</text>

  <!-- LEFT PANEL: BFS Level Hierarchy & Shortest Path Tree -->
  <g transform="translate(36, 85)">
    <rect width="380" height="425" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">BFS Level Expansion (Source = 0)</text>

    <!-- Level 0 (Dist 0) -->
    <rect x="20" y="48" width="340" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="32" y="82" class="level-txt">Level 0 (d=0):</text>
    <circle cx="170" cy="78" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="170" y="78" class="node-text">0</text>

    <!-- Connector L0 -> L1 -->
    <line x1="170" y1="96" x2="170" y2="128" stroke="#16a34a" stroke-width="2.5" marker-end="url(#tree-edge)"/>

    <!-- Level 1 (Dist 1) -->
    <rect x="20" y="125" width="340" height="60" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="32" y="159" class="level-txt">Level 1 (d=1):</text>
    <circle cx="170" cy="155" r="18" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <text x="170" y="155" class="node-text">1</text>

    <!-- Connectors L1 -> L2 -->
    <line x1="155" y1="173" x2="115" y2="205" stroke="#16a34a" stroke-width="2.5" marker-end="url(#tree-edge)"/>
    <line x1="185" y1="173" x2="225" y2="205" stroke="#16a34a" stroke-width="2.5" marker-end="url(#tree-edge)"/>

    <!-- Level 2 (Dist 2) -->
    <rect x="20" y="202" width="340" height="65" rx="6" fill="#fefce8" stroke="#fef08a"/>
    <text x="32" y="238" class="level-txt">Level 2 (d=2):</text>
    <circle cx="115" cy="235" r="18" fill="#ca8a04" stroke="#a16207" stroke-width="2"/>
    <text x="115" y="235" class="node-text">2</text>
    <circle cx="225" cy="235" r="18" fill="#ca8a04" stroke="#a16207" stroke-width="2"/>
    <text x="225" y="235" class="node-text">3</text>
    <!-- Cross-edge between 2 and 3 (not in BFS tree) -->
    <line x1="133" y1="235" x2="207" y2="235" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Connector L2 -> L3 -->
    <line x1="115" y1="253" x2="115" y2="285" stroke="#16a34a" stroke-width="2.5" marker-end="url(#tree-edge)"/>

    <!-- Level 3 (Dist 3) -->
    <rect x="20" y="282" width="340" height="60" rx="6" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="32" y="316" class="level-txt">Level 3 (d=3):</text>
    <circle cx="115" cy="312" r="18" fill="#db2777" stroke="#be185d" stroke-width="2"/>
    <text x="115" y="312" class="node-text">4</text>

    <!-- Legend -->
    <g transform="translate(20, 355)">
      <rect width="340" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <line x1="16" y1="20" x2="46" y2="20" stroke="#16a34a" stroke-width="2.5"/>
      <text x="56" y="24" class="desc-text">BFS Tree Edge (discovery)</text>
      <line x1="16" y1="38" x2="46" y2="38" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
      <text x="56" y="42" class="desc-text">Cross Edge (already visited peer)</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Queue States & Step-by-Step Execution Table -->
  <g transform="translate(436, 85)">
    <rect width="488" height="425" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">Queue State &amp; Visited Array Progression</text>

    <!-- Trace Table -->
    <g transform="translate(24, 45)">
      <!-- Header -->
      <rect x="0" y="0" width="440" height="26" fill="#e2e8f0" rx="4"/>
      <text x="10" y="17" class="step-lbl">Step</text>
      <text x="50" y="17" class="step-lbl">Pop</text>
      <text x="95" y="17" class="step-lbl">Queue (Front → Back)</text>
      <text x="260" y="17" class="step-lbl">Visited Set</text>
      <text x="365" y="17" class="step-lbl">Action</text>

      <!-- Step 0 (Init) -->
      <rect x="0" y="30" width="440" height="32" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="50" class="desc-text">0</text>
      <text x="52" y="50" class="desc-text">-</text>
      <text x="98" y="50" class="mono-code">[0]</text>
      <text x="260" y="50" class="desc-text">{0}</text>
      <text x="365" y="50" class="desc-text">Push source 0</text>

      <!-- Step 1 -->
      <rect x="0" y="66" width="440" height="32" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="86" class="desc-text">1</text>
      <text x="52" y="86" class="mono-code" fill="#2563eb">0</text>
      <text x="98" y="86" class="mono-code">[1]</text>
      <text x="260" y="86" class="desc-text">{0, 1}</text>
      <text x="365" y="86" class="desc-text">Push unvisited 1</text>

      <!-- Step 2 -->
      <rect x="0" y="102" width="440" height="32" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="12" y="122" class="desc-text">2</text>
      <text x="52" y="122" class="mono-code" fill="#16a34a">1</text>
      <text x="98" y="122" class="mono-code">[2, 3]</text>
      <text x="260" y="122" class="desc-text">{0, 1, 2, 3}</text>
      <text x="365" y="122" class="desc-text">Push unvisited 2, 3</text>

      <!-- Step 3 -->
      <rect x="0" y="138" width="440" height="32" fill="#fefce8" stroke="#fef08a"/>
      <text x="12" y="158" class="desc-text">3</text>
      <text x="52" y="158" class="mono-code" fill="#ca8a04">2</text>
      <text x="98" y="158" class="mono-code">[3, 4]</text>
      <text x="260" y="158" class="desc-text">{0, 1, 2, 3, 4}</text>
      <text x="365" y="158" class="desc-text">Push unvisited 4</text>

      <!-- Step 4 -->
      <rect x="0" y="174" width="440" height="32" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="194" class="desc-text">4</text>
      <text x="52" y="194" class="mono-code" fill="#ca8a04">3</text>
      <text x="98" y="194" class="mono-code">[4]</text>
      <text x="260" y="194" class="desc-text">{0, 1, 2, 3, 4}</text>
      <text x="365" y="194" class="desc-text">Neighbours visited</text>

      <!-- Step 5 -->
      <rect x="0" y="210" width="440" height="32" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="12" y="230" class="desc-text">5</text>
      <text x="52" y="230" class="mono-code" fill="#db2777">4</text>
      <text x="98" y="230" class="mono-code">[ ] (empty)</text>
      <text x="260" y="230" class="desc-text">{0, 1, 2, 3, 4}</text>
      <text x="365" y="230" class="desc-text">Finished!</text>
    </g>

    <!-- Traversal Output Result Box -->
    <g transform="translate(24, 305)">
      <rect width="440" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="14" y="22" class="step-lbl">Final BFS Traversal Output:</text>
      <rect x="14" y="32" width="220" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="124" y="49" class="mono-code" fill="#15803d" text-anchor="middle">0 → 1 → 2 → 3 → 4</text>

      <text x="14" y="74" class="desc-text">• Time Complexity: <tspan font-weight="600" fill="#15803d">O(V + E)</tspan> (each vertex queued 1×, each edge scanned 2×)</text>
      <text x="14" y="90" class="desc-text">• Space Complexity: <tspan font-weight="600" fill="#1e3a8a">O(V)</tspan> (queue capacity + visited boolean array)</text>
    </g>
  </g>
</svg>
