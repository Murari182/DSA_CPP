<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #1e293b; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .mono-txt { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #334155; }
      .mono-code { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: 600; font-size: 13px; fill: #1e3a8a; }
      .addr-txt { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 11px; fill: #64748b; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="ptr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="ptr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="ptr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="516" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Deep Memory Architecture: Graph Class &amp; Adjacency List</text>
  <text x="36" y="62" class="subtitle">Stack frame object, heap-allocated array of std::list, and scattered doubly-linked nodes</text>

  <!-- ZONE 1: STACK MEMORY -->
  <g transform="translate(36, 85)">
    <rect width="250" height="340" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="16" y="14" width="100" height="24" rx="4" fill="#7c3aed"/>
    <text x="66" y="26" class="badge-txt">STACK FRAME</text>
    <text x="16" y="58" class="mono-code">graph g(5);</text>

    <!-- Stack Object Box -->
    <g transform="translate(16, 75)">
      <rect width="218" height="150" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="14" y="24" class="label-bold">Object: g (sizeof = 16B)</text>
      <text x="14" y="40" class="addr-txt">Addr: 0x7ffd_9a20</text>

      <!-- Member: int V -->
      <rect x="14" y="52" width="190" height="36" rx="4" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="24" y="74" class="mono-txt">int V = 5</text>
      <text x="135" y="74" class="addr-txt">(4 bytes)</text>

      <!-- Member: list<int>* arr -->
      <rect x="14" y="98" width="190" height="42" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="24" y="116" class="mono-txt">list&lt;int&gt;* arr</text>
      <text x="24" y="132" class="mono-code" fill="#6d28d9">0x10a4_8000</text>
      <text x="135" y="132" class="addr-txt">(8-byte ptr)</text>
    </g>

    <text x="16" y="255" class="desc-text">• Allocated automatically on stack.</text>
    <text x="16" y="272" class="desc-text">• When <tspan font-weight="600">g</tspan> goes out of scope,</text>
    <text x="16" y="289" class="desc-text">  <tspan font-weight="600" fill="#7c3aed">~graph()</tspan> destructor is invoked.</text>
    <text x="16" y="306" class="desc-text">• Must call <tspan font-weight="600" fill="#dc2626">delete[] arr</tspan>!</text>
  </g>

  <!-- POINTER CONNECTOR (Stack arr -> Heap Array) -->
  <path d="M 242 205 C 275 205, 290 140, 320 140" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ptr-purple)"/>

  <!-- ZONE 2: HEAP MEMORY (Array of list objects) -->
  <g transform="translate(325, 85)">
    <rect width="250" height="340" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="16" y="14" width="150" height="24" rx="4" fill="#2563eb"/>
    <text x="91" y="26" class="badge-txt">HEAP: CONTIGUOUS ARRAY</text>
    <text x="16" y="58" class="mono-code">new list&lt;int&gt;[5];</text>

    <!-- Array Elements -->
    <g transform="translate(16, 75)">
      <!-- arr[0] -->
      <rect x="0" y="0" width="218" height="42" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="12" y="18" class="mono-code">arr[0]</text>
      <text x="65" y="18" class="addr-txt">@ 0x10a4_8000</text>
      <text x="12" y="34" class="desc-text">std::list control (head/tail/size)</text>

      <!-- arr[1] -->
      <rect x="0" y="48" width="218" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="12" y="66" class="mono-code" fill="#1d4ed8">arr[1]</text>
      <text x="65" y="66" class="addr-txt">@ 0x10a4_8018</text>
      <text x="12" y="82" class="desc-text">head → 0x9040 (nodes 0, 2, 3)</text>

      <!-- arr[2] -->
      <rect x="0" y="96" width="218" height="42" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="12" y="114" class="mono-code">arr[2]</text>
      <text x="65" y="114" class="addr-txt">@ 0x10a4_8030</text>
      <text x="12" y="130" class="desc-text">head → 0x9210 (nodes 1, 3, 4)</text>

      <!-- arr[3] -->
      <rect x="0" y="144" width="218" height="42" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="12" y="162" class="mono-code">arr[3]</text>
      <text x="65" y="162" class="addr-txt">@ 0x10a4_8048</text>
      <text x="12" y="178" class="desc-text">head → 0x9350 (nodes 2, 1)</text>

      <!-- arr[4] -->
      <rect x="0" y="192" width="218" height="42" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="12" y="210" class="mono-code">arr[4]</text>
      <text x="65" y="210" class="addr-txt">@ 0x10a4_8060</text>
      <text x="12" y="226" class="desc-text">head → 0x9480 (node 2)</text>
    </g>

    <text x="16" y="325" class="desc-text">Consecutive in memory (contiguous 5 objects).</text>
  </g>

  <!-- POINTER CONNECTOR (arr[1] -> list nodes) -->
  <path d="M 559 180 C 585 180, 595 150, 615 150" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ptr-blue)"/>

  <!-- ZONE 3: HEAP SCATTERED LINKED LIST NODES (arr[1]) -->
  <g transform="translate(620, 85)">
    <rect width="304" height="340" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="16" y="14" width="165" height="24" rx="4" fill="#16a34a"/>
    <text x="98" y="26" class="badge-txt">HEAP: SCATTERED NODES</text>
    <text x="16" y="58" class="mono-code">std::list&lt;int&gt; nodes of arr[1]</text>

    <!-- Node 0 -->
    <g transform="translate(16, 75)">
      <rect width="270" height="46" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="0" width="70" height="46" rx="4" fill="#dcfce7"/>
      <text x="35" y="23" class="mono-code" text-anchor="middle" dominant-baseline="central">data: 0</text>
      <text x="80" y="20" class="mono-txt">prev: null | next: 0x9180</text>
      <text x="80" y="36" class="addr-txt">Heap Addr: 0x9040</text>
    </g>

    <!-- Link between Node 0 and Node 2 -->
    <path d="M 150 121 L 150 145" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-green)"/>

    <!-- Node 2 -->
    <g transform="translate(16, 147)">
      <rect width="270" height="46" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="0" width="70" height="46" rx="4" fill="#dcfce7"/>
      <text x="35" y="23" class="mono-code" text-anchor="middle" dominant-baseline="central">data: 2</text>
      <text x="80" y="20" class="mono-txt">prev: 0x9040 | next: 0x92f0</text>
      <text x="80" y="36" class="addr-txt">Heap Addr: 0x9180</text>
    </g>

    <!-- Link between Node 2 and Node 3 -->
    <path d="M 150 193 L 150 217" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ptr-green)"/>

    <!-- Node 3 -->
    <g transform="translate(16, 219)">
      <rect width="270" height="46" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="0" width="70" height="46" rx="4" fill="#dcfce7"/>
      <text x="35" y="23" class="mono-code" text-anchor="middle" dominant-baseline="central">data: 3</text>
      <text x="80" y="20" class="mono-txt">prev: 0x9180 | next: null</text>
      <text x="80" y="36" class="addr-txt">Heap Addr: 0x92f0</text>
    </g>

    <text x="16" y="295" class="desc-text">• Nodes allocated individually on heap.</text>
    <text x="16" y="312" class="desc-text">• High pointer overhead (24B per node).</text>
    <text x="16" y="329" class="desc-text">• Poor CPU cache locality vs std::vector.</text>
  </g>

  <!-- BOTTOM COMPARISON BANNER -->
  <g transform="translate(36, 440)">
    <rect width="888" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" class="label-bold" fill="#0f172a">Container Choice Comparison for Adjacency Lists:</text>
    <text x="20" y="44" class="desc-text">• <tspan font-weight="600" fill="#7c3aed">list&lt;int&gt;* arr = new list&lt;int&gt;[V]:</tspan> Educational; manual memory management with <tspan class="mono-code">delete[] arr</tspan>; non-contiguous nodes.</text>
    <text x="20" y="58" class="desc-text">• <tspan font-weight="600" fill="#15803d">vector&lt;vector&lt;int&gt;&gt; adj(V):</tspan> Modern C++ standard; automatic RAII; 100% contiguous element buffers; optimal CPU L1/L2 cache prefetching.</text>
  </g>
</svg>
