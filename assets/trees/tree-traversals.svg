<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-txt { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .code-font { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #1e3a8a; }
      .order-txt { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 13px; fill: #15803d; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Binary Tree Traversals: Depth-First vs Breadth-First</text>
  <text x="36" y="62" class="subtitle">Recursive call stack progression, DFS orderings (Pre, In, Post), and BFS level-order queue mechanics</text>

  <!-- LEFT PANEL: The Reference Binary Tree -->
  <g transform="translate(36, 85)">
    <rect width="360" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">Reference Binary Tree</text>

    <!-- Tree Drawing -->
    <g transform="translate(20, 45)">
      <!-- Edges -->
      <line x1="160" y1="35" x2="90" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="160" y1="35" x2="230" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="90" y1="95" x2="50" y2="165" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="90" y1="95" x2="130" y2="165" stroke="#94a3b8" stroke-width="2.5"/>

      <!-- Node 1 (Root) -->
      <circle cx="160" cy="35" r="18" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
      <text x="160" y="35" class="node-txt">1</text>

      <!-- Node 2 -->
      <circle cx="90" cy="95" r="17" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="90" y="95" class="node-txt">2</text>

      <!-- Node 3 -->
      <circle cx="230" cy="95" r="17" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="230" y="95" class="node-txt">3</text>

      <!-- Node 4 -->
      <circle cx="50" cy="165" r="16" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
      <text x="50" y="165" class="node-txt">4</text>

      <!-- Node 5 -->
      <circle cx="130" cy="165" r="16" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
      <text x="130" y="165" class="node-txt">5</text>
    </g>

    <!-- Call Stack Memory Box -->
    <g transform="translate(20, 245)">
      <rect width="320" height="135" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="22" class="section-title" font-size="13">Recursion Call Stack Property:</text>
      <text x="14" y="44" class="desc-text">• Visited nodes push a stack frame onto memory.</text>
      <text x="14" y="62" class="desc-text">• Maximum call stack depth = <tspan font-weight="600">Tree Height (h)</tspan>.</text>
      <text x="14" y="80" class="desc-text">• Balanced Tree: \( h = O(\log n) \) stack frames.</text>
      <text x="14" y="98" class="desc-text">• Skewed Tree: \( h = O(n) \) stack frames.</text>
      <text x="14" y="118" class="desc-text">• All DFS traversals take <tspan font-weight="600" fill="#15803d">O(n) time</tspan> (visit each node 1x).</text>
    </g>
  </g>

  <!-- RIGHT PANEL: The 4 Traversals Breakdown -->
  <g transform="translate(416, 85)">
    <rect width="508" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">The 4 Traversal Orders &amp; Key Applications</text>

    <!-- 1. Preorder -->
    <g transform="translate(24, 45)">
      <rect width="460" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="14" y="20" class="code-font" fill="#7c3aed">1. Preorder Traversal (Root → Left → Right)</text>
      <text x="14" y="38" class="desc-text">Action: Process parent before visiting subtrees.</text>
      <text x="14" y="58" class="order-txt">Sequence: 1 → 2 → 4 → 5 → 3</text>
      <text x="250" y="58" class="desc-text" fill="#64748b">Use: Cloning/serializing trees</text>
    </g>

    <!-- 2. Inorder -->
    <g transform="translate(24, 130)">
      <rect width="460" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="14" y="20" class="code-font" fill="#1e40af">2. Inorder Traversal (Left → Root → Right)</text>
      <text x="14" y="38" class="desc-text">Action: Visit left subtree, process parent, then right subtree.</text>
      <text x="14" y="58" class="order-txt">Sequence: 4 → 2 → 5 → 1 → 3</text>
      <text x="250" y="58" class="desc-text" fill="#15803d" font-weight="600">BST Superpower: Yields ASCENDING sort!</text>
    </g>

    <!-- 3. Postorder -->
    <g transform="translate(24, 215)">
      <rect width="460" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="14" y="20" class="code-font" fill="#ea580c">3. Postorder Traversal (Left → Right → Root)</text>
      <text x="14" y="38" class="desc-text">Action: Process both subtrees before processing parent.</text>
      <text x="14" y="58" class="order-txt">Sequence: 4 → 5 → 2 → 3 → 1</text>
      <text x="250" y="58" class="desc-text" fill="#64748b">Use: Bottom-up deletion, height calc</text>
    </g>

    <!-- 4. Level-Order (BFS) -->
    <g transform="translate(24, 300)">
      <rect width="460" height="85" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="14" y="20" class="code-font" fill="#15803d">4. Level-Order Traversal (Breadth-First Search)</text>
      <text x="14" y="38" class="desc-text">Action: Uses a FIFO Queue to visit nodes level-by-level horizontally.</text>
      <text x="14" y="58" class="order-txt">Sequence: 1 → 2 → 3 → 4 → 5</text>
      <text x="14" y="74" class="desc-text">Queue states: [1] → [2, 3] → [3, 4, 5] → [4, 5] → [5] → [ ] | Space: \( O(w) \)</text>
    </g>
  </g>
</svg>
