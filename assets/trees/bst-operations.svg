<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .node-txt { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .code-font { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #1e3a8a; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Binary Search Tree (BST): Search, Insert &amp; Deletion Cases</text>
  <text x="36" y="62" class="subtitle">The BST ordering invariant, binary search path, and the three canonical deletion cases</text>

  <!-- LEFT PANEL: BST Invariant & Search/Insert -->
  <g transform="translate(36, 85)">
    <rect width="440" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">BST Ordering Invariant &amp; Search Path</text>
    <text x="20" y="48" class="desc-text">For every node u: <tspan class="code-font">all left &lt; u &lt; all right</tspan></text>

    <!-- Visual BST -->
    <g transform="translate(40, 60)">
      <!-- Edges -->
      <line x1="180" y1="35" x2="100" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="180" y1="35" x2="260" y2="95" stroke="#ea580c" stroke-width="3"/>
      <line x1="100" y1="95" x2="60" y2="155" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="100" y1="95" x2="140" y2="155" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="260" y1="95" x2="220" y2="155" stroke="#ea580c" stroke-width="3"/>
      <line x1="260" y1="95" x2="300" y2="155" stroke="#94a3b8" stroke-width="2.5"/>

      <!-- Node 50 (Root) -->
      <circle cx="180" cy="35" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="180" y="35" class="node-txt">50</text>

      <!-- Node 30 -->
      <circle cx="100" cy="95" r="17" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="100" y="95" class="node-txt">30</text>

      <!-- Node 70 (Search Step 1: 65 > 50 -> Go Right) -->
      <circle cx="260" cy="95" r="18" fill="#ea580c" stroke="#c2410c" stroke-width="2.5"/>
      <text x="260" y="95" class="node-txt">70</text>

      <!-- Node 20 -->
      <circle cx="60" cy="155" r="16" fill="#2563eb"/>
      <text x="60" y="155" class="node-txt">20</text>

      <!-- Node 40 -->
      <circle cx="140" cy="155" r="16" fill="#2563eb"/>
      <text x="140" y="155" class="node-txt">40</text>

      <!-- Node 65 (Target Found! 65 < 70 -> Go Left) -->
      <circle cx="220" cy="155" r="18" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>
      <text x="220" y="155" class="node-txt">65</text>
      <text x="220" y="185" class="desc-text" font-weight="bold" fill="#15803d" text-anchor="middle">Found 65!</text>

      <!-- Node 80 -->
      <circle cx="300" cy="155" r="16" fill="#2563eb"/>
      <text x="300" y="155" class="node-txt">80</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(20, 260)">
      <rect width="400" height="120" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="22" class="section-title" font-size="13">Search &amp; Insert Complexity:</text>
      <text x="14" y="44" class="desc-text">• <tspan font-weight="600">Balanced BST:</tspan> Height \( h = O(\log n) \). Search takes <tspan font-weight="600" fill="#15803d">O(log n)</tspan>.</text>
      <text x="14" y="62" class="desc-text">• <tspan font-weight="600" fill="#dc2626">Degenerate Skewed BST:</tspan> Insertion of sorted data [10, 20, 30, 40]</text>
      <text x="14" y="78" class="desc-text">  degrades tree into a linked list of height \( n \)!</text>
      <text x="14" y="96" class="desc-text">• Worst-Case Search: <tspan font-weight="600" fill="#dc2626">O(n)</tspan>! Motivates Self-Balancing Trees (AVL)!</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Deletion 3 Cases -->
  <g transform="translate(500, 85)">
    <rect width="424" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">The Three Deletion Cases</text>

    <!-- Case 1 -->
    <g transform="translate(24, 45)">
      <rect width="376" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="20" class="code-font" fill="#1e40af">Case 1: Node is a Leaf (0 Children)</text>
      <text x="12" y="40" class="desc-text">Simply sever the parent's pointer (<tspan class="code-font">nullptr</tspan>) and delete node.</text>
      <text x="12" y="58" class="desc-text">Example: Deleting 20, 40, 65, or 80. Effort: \( O(1) \).</text>
    </g>

    <!-- Case 2 -->
    <g transform="translate(24, 130)">
      <rect width="376" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="20" class="code-font" fill="#15803d">Case 2: Node has Exactly 1 Child</text>
      <text x="12" y="40" class="desc-text">Bypass the node by linking parent directly to the single child,</text>
      <text x="12" y="56" class="desc-text">then delete the target node.</text>
      <text x="12" y="72" class="desc-text">Similar to deleting a node from a singly linked list.</text>
    </g>

    <!-- Case 3 -->
    <g transform="translate(24, 225)">
      <rect width="376" height="155" rx="6" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="12" y="20" class="code-font" fill="#be185d">Case 3: Node has 2 Children (Complex Case)</text>
      <text x="12" y="40" class="desc-text">Cannot simply remove node without breaking subtrees!</text>
      <text x="12" y="60" class="desc-text">1. Find <tspan font-weight="600" fill="#be185d">Inorder Successor</tspan> (smallest key in right subtree:</text>
      <text x="24" y="76" class="code-font">successor = minNode(node-&gt;right);</text>
      <text x="12" y="96" class="desc-text">2. Copy successor's data into current node: <tspan class="code-font">node-&gt;data = succ-&gt;data</tspan>.</text>
      <text x="12" y="116" class="desc-text">3. Recursively delete successor from right subtree (guaranteed</text>
      <text x="12" y="132" class="desc-text">   to fall into Case 1 or Case 2!). Preserves BST invariant perfectly.</text>
    </g>
  </g>
</svg>
