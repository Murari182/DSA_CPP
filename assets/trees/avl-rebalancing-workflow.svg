<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">AVL insertion and deletion rebalancing workflow</title>
  <desc id="description">Both operations update heights while returning from normal BST work. Insertion chooses a rotation from the inserted key direction; deletion chooses from the heavy child's balance factor and may rebalance multiple ancestors.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .step { font-size: 18px; font-weight: 600; }
      .detail { font-size: 16px; }
      .rotation { font-size: 15px; font-weight: 600; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .shared { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 2; }
      .insert-panel { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .delete-panel { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 2; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">AVL Rebalancing: Insertion vs. Deletion</text>
  <text x="600" y="75" text-anchor="middle" class="subtitle">The decision rule differs; both operations return the updated subtree root to the caller.</text>

  <rect x="250" y="100" width="700" height="74" rx="12" class="shared"/>
  <text x="600" y="131" text-anchor="middle" class="step">Normal BST update, then unwind toward the root</text>
  <text x="600" y="156" text-anchor="middle" class="detail">Update each height, calculate BF = height(left) - height(right), and check for |BF| &gt; 1.</text>

  <path d="M600 174 V195 H300 V215" class="branch"/>
  <path d="M600 174 V195 H900 V215" class="branch"/>

  <rect x="35" y="215" width="530" height="465" rx="16" class="insert-panel"/>
  <text x="300" y="250" text-anchor="middle" class="panel-title">Insertion</text>
  <rect x="80" y="270" width="440" height="82" rx="10" class="box"/>
  <text x="300" y="302" text-anchor="middle" class="step">Use the inserted key's direction</text>
  <text x="300" y="329" text-anchor="middle" class="detail">Compare the key with the heavy child.</text>

  <path d="M300 352 V380" class="arrow"/>
  <rect x="80" y="380" width="440" height="108" rx="10" class="box"/>
  <text x="300" y="410" text-anchor="middle" class="step">Choose one of four cases</text>
  <text x="300" y="439" text-anchor="middle" class="rotation">LL: right rotation   |   LR: left, then right</text>
  <text x="300" y="466" text-anchor="middle" class="rotation">RR: left rotation    |   RL: right, then left</text>

  <path d="M300 488 V516" class="arrow"/>
  <rect x="80" y="516" width="440" height="120" rx="10" class="box"/>
  <text x="300" y="548" text-anchor="middle" class="step">Return the new subtree root</text>
  <text x="300" y="577" text-anchor="middle" class="detail">Reconnect it to the parent; insertion needs</text>
  <text x="300" y="602" text-anchor="middle" class="detail">no further rotations above the first repair.</text>

  <rect x="635" y="215" width="530" height="465" rx="16" class="delete-panel"/>
  <text x="900" y="250" text-anchor="middle" class="panel-title">Deletion</text>
  <rect x="680" y="270" width="440" height="82" rx="10" class="box"/>
  <text x="900" y="302" text-anchor="middle" class="step">Inspect the heavy child's balance factor</text>
  <text x="900" y="329" text-anchor="middle" class="detail">The deleted key does not identify the case.</text>

  <path d="M900 352 V380" class="arrow"/>
  <rect x="680" y="380" width="440" height="108" rx="10" class="box"/>
  <text x="900" y="410" text-anchor="middle" class="step">Choose the rotation</text>
  <text x="900" y="439" text-anchor="middle" class="rotation">BF &gt; 1: child BF &gt;= 0: LL; otherwise LR</text>
  <text x="900" y="466" text-anchor="middle" class="rotation">BF &lt; -1: child BF &lt;= 0: RR; otherwise RL</text>

  <path d="M900 488 V516" class="arrow"/>
  <rect x="680" y="516" width="440" height="120" rx="10" class="box"/>
  <text x="900" y="548" text-anchor="middle" class="step">Return the new subtree root</text>
  <text x="900" y="577" text-anchor="middle" class="detail">Continue checking every ancestor; a deletion</text>
  <text x="900" y="602" text-anchor="middle" class="detail">can require more than one rebalancing step.</text>
</svg>
