<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .tree-node { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .cell-text { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 14px; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .cell-text-w { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 14px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .pass-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #1e3a8a; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .code-font { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 11px; fill: #1e3a8a; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Heap Sort: Max-Heap Construction &amp; In-Place Extraction</text>
  <text x="36" y="62" class="subtitle">Complete binary tree representation, O(n) heapify-up build, and guaranteed O(n log n) in-place sorting</text>

  <!-- LEFT PANEL: Max-Heap Tree Structure -->
  <g transform="translate(36, 85)">
    <rect width="430" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">Phase 1: Build Max-Heap on [5, 1, 4, 2, 8]</text>

    <!-- Visual Tree -->
    <g transform="translate(35, 45)">
      <!-- Tree Lines -->
      <line x1="180" y1="30" x2="100" y2="80" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="180" y1="30" x2="260" y2="80" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="100" y1="80" x2="60" y2="140" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="100" y1="80" x2="140" y2="140" stroke="#3b82f6" stroke-width="2.5"/>

      <!-- Root Node (Max Element = 8 @ arr[0]) -->
      <circle cx="180" cy="30" r="18" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
      <text x="180" y="30" class="tree-node">8</text>
      <text x="180" y="8" class="desc-text" text-anchor="middle" font-size="11">arr[0]</text>

      <!-- Level 1 Nodes -->
      <circle cx="100" cy="80" r="17" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="100" y="80" class="tree-node">5</text>
      <text x="65" y="80" class="desc-text" font-size="11">arr[1]</text>

      <circle cx="260" cy="80" r="17" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="260" y="80" class="tree-node">4</text>
      <text x="295" y="80" class="desc-text" font-size="11">arr[2]</text>

      <!-- Level 2 Nodes -->
      <circle cx="60" cy="140" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="60" y="140" class="tree-node">2</text>
      <text x="25" y="140" class="desc-text" font-size="11">arr[3]</text>

      <circle cx="140" cy="140" r="16" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <text x="140" y="140" class="tree-node">1</text>
      <text x="175" y="140" class="desc-text" font-size="11">arr[4]</text>
    </g>

    <!-- Max-Heap Array Mapping Box -->
    <g transform="translate(20, 235)">
      <rect width="390" height="145" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="22" class="pass-hdr">Complete Binary Tree Array Mapping:</text>
      <text x="14" y="42" class="code-font">• Parent(i) = (i - 1) / 2</text>
      <text x="14" y="58" class="code-font">• LeftChild(i) = 2i + 1  |  RightChild(i) = 2i + 2</text>
      <text x="14" y="76" class="desc-text">• Max-Heap Property: <tspan class="code-font">arr[parent] &gt;= arr[child]</tspan></text>
      <text x="14" y="94" class="desc-text">• Heap built in-place in <tspan font-weight="600" fill="#15803d">O(n)</tspan> time using bottom-up heapify.</text>
      <text x="14" y="112" class="desc-text">• Resulting Max-Heap Array: <tspan class="code-font" font-weight="bold">[8, 5, 4, 2, 1]</tspan></text>
      <text x="14" y="130" class="desc-text">• Auxiliary Space: <tspan font-weight="600" fill="#15803d">O(1)</tspan> (Zero extra arrays!).</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Extraction Loop -->
  <g transform="translate(490, 85)">
    <rect width="434" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">Phase 2: Repeated Root Extraction (Swap &amp; Sift-Down)</text>

    <!-- Extraction Steps -->
    <g transform="translate(24, 45)">
      <!-- Step 1 -->
      <text x="0" y="14" class="code-font">1. Swap root 8 with arr[4] (val 1) → Lock 8. HeapifyDown(0):</text>
      <rect x="0" y="22" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="18" y="37" class="cell-text">5</text>
      <rect x="40" y="22" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="58" y="37" class="cell-text">2</text>
      <rect x="80" y="22" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="98" y="37" class="cell-text">4</text>
      <rect x="120" y="22" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="138" y="37" class="cell-text">1</text>
      <rect x="160" y="22" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="178" y="37" class="cell-text-w">8</text>
      <text x="210" y="37" class="desc-text" fill="#15803d">Locked [4]</text>

      <!-- Step 2 -->
      <text x="0" y="80" class="code-font">2. Swap root 5 with arr[3] (val 1) → Lock 5. HeapifyDown(0):</text>
      <rect x="0" y="88" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="18" y="103" class="cell-text">4</text>
      <rect x="40" y="88" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="58" y="103" class="cell-text">2</text>
      <rect x="80" y="88" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="98" y="103" class="cell-text">1</text>
      <rect x="120" y="88" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="138" y="103" class="cell-text-w">5</text>
      <rect x="160" y="88" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="178" y="103" class="cell-text-w">8</text>
      <text x="210" y="103" class="desc-text" fill="#15803d">Locked [3]</text>

      <!-- Step 3 -->
      <text x="0" y="146" class="code-font">3. Swap root 4 with arr[2] (val 1) → Lock 4. HeapifyDown(0):</text>
      <rect x="0" y="154" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="18" y="169" class="cell-text">2</text>
      <rect x="40" y="154" width="36" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="58" y="169" class="cell-text">1</text>
      <rect x="80" y="154" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="98" y="169" class="cell-text-w">4</text>
      <rect x="120" y="154" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="138" y="169" class="cell-text-w">5</text>
      <rect x="160" y="154" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="178" y="169" class="cell-text-w">8</text>
      <text x="210" y="169" class="desc-text" fill="#15803d">Locked [2]</text>

      <!-- Step 4 -->
      <text x="0" y="212" class="code-font">4. Swap root 2 with arr[1] (val 1) → Final array completely sorted!</text>
      <rect x="0" y="220" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="18" y="235" class="cell-text-w">1</text>
      <rect x="40" y="220" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="58" y="235" class="cell-text-w">2</text>
      <rect x="80" y="220" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="98" y="235" class="cell-text-w">4</text>
      <rect x="120" y="220" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="138" y="235" class="cell-text-w">5</text>
      <rect x="160" y="220" width="36" height="30" rx="3" fill="#16a34a"/>
      <text x="178" y="235" class="cell-text-w">8</text>
      <text x="210" y="235" class="desc-text" fill="#15803d" font-weight="600">All 5 Sorted!</text>
    </g>

    <!-- Tradeoffs Box -->
    <g transform="translate(24, 305)">
      <rect width="386" height="85" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="14" y="22" class="pass-hdr">Why Heap Sort is a Systems Favorite:</text>
      <text x="14" y="42" class="desc-text">• <tspan font-weight="600" fill="#15803d">Guaranteed O(n log n):</tspan> Unlike Quick Sort, has no O(n²) worst-case!</text>
      <text x="14" y="58" class="desc-text">• <tspan font-weight="600" fill="#15803d">In-Place O(1) Memory:</tspan> Unlike Merge Sort, requires zero extra RAM.</text>
      <text x="14" y="74" class="desc-text">• <tspan font-weight="600">Drawback:</tspan> <tspan font-weight="600" fill="#dc2626">UNSTABLE</tspan> and poorer cache locality than Quick Sort.</text>
    </g>
  </g>
</svg>
