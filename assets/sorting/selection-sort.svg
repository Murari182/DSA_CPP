<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .cell-text { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .cell-text-w { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .min-txt { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 14px; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
      .pass-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #1e3a8a; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .code-font { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 11px; fill: #1e3a8a; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Selection Sort: Unsorted Scan &amp; Minimum Extraction</text>
  <text x="36" y="62" class="subtitle">Scanning for absolute minimum index, exactly one swap per pass, and O(n²) comparison rigidity</text>

  <!-- LEFT PANEL: Step-by-Step Scan & Single Swap -->
  <g transform="translate(36, 85)">
    <rect width="455" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="28" class="section-title">Execution Trace on [5, 1, 4, 2, 8]</text>

    <!-- Pass 0 -->
    <g transform="translate(20, 45)">
      <text x="0" y="14" class="code-font">Pass 0: Scan [5, 1, 4, 2, 8] → minIndex = 1 (val 1). Swap arr[0] ↔ arr[1]</text>
      <rect x="0" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="19" y="38" class="cell-text-w">1</text>
      <rect x="42" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="61" y="38" class="cell-text">5</text>
      <rect x="84" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="103" y="38" class="cell-text">4</text>
      <rect x="126" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="145" y="38" class="cell-text">2</text>
      <rect x="168" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="187" y="38" class="cell-text">8</text>
      <text x="220" y="38" class="desc-text" fill="#15803d">1 locked at [0]</text>
    </g>

    <!-- Pass 1 -->
    <g transform="translate(20, 115)">
      <text x="0" y="14" class="code-font">Pass 1: Scan unsorted [5, 4, 2, 8] → minIndex = 3 (val 2). Swap arr[1] ↔ arr[3]</text>
      <rect x="0" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="19" y="38" class="cell-text-w">1</text>
      <rect x="42" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="61" y="38" class="cell-text-w">2</text>
      <rect x="84" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="103" y="38" class="cell-text">4</text>
      <rect x="126" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="145" y="38" class="cell-text">5</text>
      <rect x="168" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="187" y="38" class="cell-text">8</text>
      <text x="220" y="38" class="desc-text" fill="#15803d">2 locked at [1]</text>
    </g>

    <!-- Pass 2 -->
    <g transform="translate(20, 185)">
      <text x="0" y="14" class="code-font">Pass 2: Scan unsorted [4, 5, 8] → minIndex = 2 (val 4). Swap arr[2] ↔ arr[2] (self)</text>
      <rect x="0" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="19" y="38" class="cell-text-w">1</text>
      <rect x="42" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="61" y="38" class="cell-text-w">2</text>
      <rect x="84" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="103" y="38" class="cell-text-w">4</text>
      <rect x="126" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="145" y="38" class="cell-text">5</text>
      <rect x="168" y="22" width="38" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="187" y="38" class="cell-text">8</text>
      <text x="220" y="38" class="desc-text" fill="#15803d">4 locked at [2]</text>
    </g>

    <!-- Pass 3 -->
    <g transform="translate(20, 255)">
      <text x="0" y="14" class="code-font">Pass 3: Scan unsorted [5, 8] → minIndex = 3 (val 5). Swap arr[3] ↔ arr[3]</text>
      <rect x="0" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="19" y="38" class="cell-text-w">1</text>
      <rect x="42" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="61" y="38" class="cell-text-w">2</text>
      <rect x="84" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="103" y="38" class="cell-text-w">4</text>
      <rect x="126" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="145" y="38" class="cell-text-w">5</text>
      <rect x="168" y="22" width="38" height="32" rx="4" fill="#16a34a"/>
      <text x="187" y="38" class="cell-text-w">8</text>
      <text x="220" y="38" class="desc-text" fill="#15803d">All 5 sorted!</text>
    </g>

    <g transform="translate(20, 325)">
      <rect width="415" height="65" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="22" class="pass-hdr">Key Takeaway on Memory Writes:</text>
      <text x="14" y="42" class="desc-text">• Maximum swaps: exactly <tspan font-weight="600" fill="#15803d">n - 1</tspan> swaps!</text>
      <text x="14" y="58" class="desc-text">• Optimal when writing to memory is extremely costly (e.g. Flash EEPROM).</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Why Selection Sort is Unstable & Non-Adaptive -->
  <g transform="translate(515, 85)">
    <rect width="409" height="405" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="28" class="section-title">Critical Flaws: Non-Adaptive &amp; Unstable</text>

    <!-- Box 1: Why Non-Adaptive -->
    <g transform="translate(24, 45)">
      <rect width="361" height="135" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="14" y="22" class="pass-hdr" fill="#991b1b">Flaw 1: Blind O(n²) Comparisons</text>
      <text x="14" y="44" class="desc-text">• Selection sort cannot detect if an array is already sorted.</text>
      <text x="14" y="60" class="desc-text">• Even on [1, 2, 3, 4, 5], it strictly checks all pairs:</text>
      <text x="24" y="80" class="code-font" fill="#b91c1c">\frac{n(n-1)}{2} = 10 \text{ comparisons}</text>
      <text x="14" y="104" class="desc-text">• <tspan font-weight="600">Best Case:</tspan> O(n²) | <tspan font-weight="600">Avg:</tspan> O(n²) | <tspan font-weight="600">Worst:</tspan> O(n²).</text>
      <text x="14" y="120" class="desc-text">• It is completely <tspan font-weight="600" fill="#b91c1c">NON-ADAPTIVE</tspan>.</text>
    </g>

    <!-- Box 2: Why Unstable -->
    <g transform="translate(24, 195)">
      <rect width="361" height="195" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="14" y="22" class="pass-hdr" fill="#9a3412">Flaw 2: Why it is UNSTABLE</text>
      <text x="14" y="44" class="desc-text">Consider array with identical keys: [ 4a, 4b, 2 ]</text>
      <text x="14" y="64" class="desc-text">• Pass 0: Minimum is 2 at index 2.</text>
      <text x="14" y="82" class="desc-text">• Swap arr[0] with arr[2]:</text>
      <text x="24" y="102" class="code-font" fill="#c2410c">[ 2, 4b, 4a ]</text>
      <text x="14" y="126" class="desc-text">• Notice: <tspan font-weight="600">4b</tspan> now appears BEFORE <tspan font-weight="600">4a</tspan>!</text>
      <text x="14" y="144" class="desc-text">• The relative order of equal keys was corrupted!</text>
      <text x="14" y="162" class="desc-text">• Hence, Selection Sort is fundamentally <tspan font-weight="600" fill="#dc2626">UNSTABLE</tspan>.</text>
      <text x="14" y="180" class="desc-text">• Auxiliary Space: <tspan font-weight="600" fill="#15803d">O(1)</tspan> in-place.</text>
    </g>
  </g>
</svg>
