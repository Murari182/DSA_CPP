<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #1e293b; }
      .cell-text { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 15px; fill: #1e3a8a; text-anchor: middle; dominant-baseline: central; }
      .ptr-text { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 11px; fill: #6d28d9; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .code-font { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; fill: #1e3a8a; }
      .pointer-badge { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-weight: bold; font-size: 11px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="rev-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="rev-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="496" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="42" class="title">Iterative Linked List Reversal: The 3-Pointer Technique</text>
  <text x="36" y="62" class="subtitle">Preserving the forward chain with next_node, inverting curr->next, and in-place O(1) space guarantee</text>

  <!-- TOP PANEL: The 4 Invariable Steps per Iteration -->
  <g transform="translate(36, 85)">
    <rect width="888" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="20" y="24" class="section-title">The Invariant 4-Step Cycle (Pointers: prev, curr, next_node)</text>

    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="200" height="65" rx="4" fill="#ffffff" stroke="#93c5fd"/>
      <text x="12" y="20" class="code-font" fill="#1e40af">1. Save Next Node:</text>
      <text x="12" y="40" class="code-font" font-weight="bold">next_node = curr-&gt;next;</text>
      <text x="12" y="55" class="desc-text">Prevents losing the rest of list</text>

      <rect x="215" y="0" width="200" height="65" rx="4" fill="#ffffff" stroke="#86efac"/>
      <text x="12" y="20" class="code-font" fill="#166534">2. Reverse Connection:</text>
      <text x="12" y="40" class="code-font" font-weight="bold" fill="#15803d">curr-&gt;next = prev;</text>
      <text x="12" y="55" class="desc-text">Inverts pointer backward</text>

      <rect x="430" y="0" width="200" height="65" rx="4" fill="#ffffff" stroke="#fed7aa"/>
      <text x="12" y="20" class="code-font" fill="#c2410c">3. Advance 'prev':</text>
      <text x="12" y="40" class="code-font" font-weight="bold" fill="#ea580c">prev = curr;</text>
      <text x="12" y="55" class="desc-text">Moves prev forward</text>

      <rect x="645" y="0" width="200" height="65" rx="4" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="12" y="20" class="code-font" fill="#6d28d9">4. Advance 'curr':</text>
      <text x="12" y="40" class="code-font" font-weight="bold" fill="#7c3aed">curr = next_node;</text>
      <text x="12" y="55" class="desc-text">Advances to next node</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: Step-by-Step Visual Transition -->
  <g transform="translate(36, 220)">
    <rect width="888" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="28" class="section-title">Intermediate State: Reversing Node 20 (curr = 20, prev = 10, next_node = 30)</text>

    <!-- Node 10 (Already reversed, points to null) -->
    <g transform="translate(180, 80)">
      <rect x="0" y="0" width="45" height="40" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="22" y="20" class="cell-text" fill="#15803d">10</text>
      <rect x="45" y="0" width="35" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
      <text x="62" y="20" class="ptr-text">next</text>

      <!-- Reversed arrow to null -->
      <line x1="0" y1="20" x2="-60" y2="20" stroke="#16a34a" stroke-width="2.5" marker-end="url(#rev-green)"/>
      <text x="-90" y="20" class="desc-text" font-weight="bold">nullptr</text>

      <!-- Badge for prev -->
      <rect x="15" y="55" width="50" height="20" rx="3" fill="#ea580c"/>
      <text x="40" y="65" class="pointer-badge">prev</text>
    </g>

    <!-- Node 20 (Active curr) -->
    <g transform="translate(400, 80)">
      <rect x="0" y="0" width="45" height="40" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
      <text x="22" y="20" class="cell-text" fill="#c2410c">20</text>
      <rect x="45" y="0" width="35" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
      <text x="62" y="20" class="ptr-text">next</text>

      <!-- Reversed pointer arrow pointing BACK to 10 -->
      <path d="M 0 20 L -140 20" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#rev-green)"/>

      <!-- Badge for curr -->
      <rect x="15" y="55" width="50" height="20" rx="3" fill="#7c3aed"/>
      <text x="40" y="65" class="pointer-badge">curr</text>
    </g>

    <!-- Node 30 (next_node - not yet reversed) -->
    <g transform="translate(620, 80)">
      <rect x="0" y="0" width="45" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="22" y="20" class="cell-text">30</text>
      <rect x="45" y="0" width="35" height="40" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
      <text x="62" y="20" class="ptr-text">next</text>

      <!-- Forward pointer to 40 -->
      <line x1="80" y1="20" x2="130" y2="20" stroke="#2563eb" stroke-width="2.5" marker-end="url(#rev-blue)"/>
      <text x="160" y="20" class="cell-text">[40]</text>

      <!-- Badge for next_node -->
      <rect x="5" y="55" width="70" height="20" rx="3" fill="#2563eb"/>
      <text x="40" y="65" class="pointer-badge">next_node</text>
    </g>

    <!-- Final State Summary -->
    <g transform="translate(30, 185)">
      <rect width="828" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="22" class="section-title" font-size="13">Termination &amp; New Head Assignment:</text>
      <text x="16" y="42" class="desc-text">• When <tspan class="code-font">curr == nullptr</tspan>, the entire chain has been reversed.</text>
      <text x="16" y="58" class="desc-text">• The pointer <tspan font-weight="600" fill="#ea580c">prev</tspan> now points to the last original node, which is the <tspan font-weight="600" fill="#15803d">NEW HEAD</tspan>! Simply return <tspan class="code-font">prev</tspan>. Time: <tspan font-weight="600">O(n)</tspan>, Space: <tspan font-weight="600">O(1)</tspan>.</text>
    </g>
  </g>
</svg>
